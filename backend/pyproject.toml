[project]
name = "underground-backend"
version = "0.1.0"
description = "REST API for the UNDERGROUND store (FastAPI, SQLAlchemy, PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
